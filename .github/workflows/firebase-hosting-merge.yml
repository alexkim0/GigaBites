name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - uses: actions/checkout@v4

      # 2) Setup Node (pick whatever version you use locally)
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3) Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4) Build the React app → creates `build/` folder
      - name: Build app
        run: npm run build
        env:
          CI: false

      # 5) Deploy to Firebase Hosting (uses the built `build/` folder)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GIGABITES_F44FE }}
          channelId: live
          projectId: gigabites-f44fe